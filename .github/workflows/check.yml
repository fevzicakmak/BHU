name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check core.js && node --check drag.js && node --check suggestions.js && node --check autocomplete.js && node --check native.js
      - run: node --test tests/*.test.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/browser.py
      - run: python tests/drag.py
      - run: python tests/autocomplete.py
      - run: python tests/native.py
      - run: python tests/webkit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  ios-build:
    # Keep the host architecture explicit; the ARM image stalled in simulator
    # graphics readiness before BHU was installed. The same SDK is used here.
    runs-on: macos-15-intel
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: xcodebuild -version
      - name: Compile iOS simulator app without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -configuration Debug -derivedDataPath ios-build
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify native startup and persistence
        env:
          BHU_DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          if [ "$BHU_DEVICE_FAMILY" = "iPhone" ]; then
            python3 scripts/smoke-ios.py ios-build/Build/Products/Debug-iphonesimulator/App.app com.fevzicakmak.bhu --device-family "$BHU_DEVICE_FAMILY" --storage-tests --timeout 1200
          else
            python3 scripts/smoke-ios.py ios-build/Build/Products/Debug-iphonesimulator/App.app com.fevzicakmak.bhu --device-family "$BHU_DEVICE_FAMILY"
          fi
      - name: Package simulator bundle preserving executable permissions
        if: matrix.family == 'iPhone'
        run: ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app BHU-simulator.zip
      - uses: actions/upload-artifact@v4
        if: matrix.family == 'iPhone'
        with:
          name: BHU-unsigned-simulator-app
          path: BHU-simulator.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BHU-native-startup-check-${{ matrix.family }}
          path: test-artifacts/native-ios-*
          if-no-files-found: ignore
          retention-days: 7

  ios-release:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Archive the Release app for physical iOS devices without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphoneos -destination 'generic/platform=iOS'
          -configuration Release -derivedDataPath ios-release/DerivedData
          -archivePath ios-release/BHU.xcarchive
          CODE_SIGNING_ALLOWED=NO archive
      - name: Inspect the actual Release archive
        run: python3 scripts/check-ios-archive.py ios-release/BHU.xcarchive --output test-artifacts/ios-release/report.json
      - name: Package the unsigned archive preserving executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent ios-release/BHU.xcarchive BHU-unsigned-release-archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BHU-unsigned-release-archive
          path: BHU-unsigned-release-archive.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BHU-release-inspection
          path: test-artifacts/ios-release/
          if-no-files-found: ignore
          retention-days: 7
