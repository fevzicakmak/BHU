name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check core.js && node --check drag.js && node --check suggestions.js && node --check autocomplete.js
      - run: node --test tests/core.test.js tests/suggestions.test.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - run: python tests/drag.py
      - run: python tests/autocomplete.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
