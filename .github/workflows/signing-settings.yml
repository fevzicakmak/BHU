name: iOS signing settings and assets

on:
  push:
    branches: [main, codex/ios-signing, codex/bhu-icon]
    paths:
      - ios/App/App.xcodeproj/project.pbxproj
      - .github/workflows/signing-settings.yml
      - .github/workflows/testflight.yml
      - scripts/ios-signing.mjs
      - tests/ios-signing.test.mjs
      - assets/branding/**
      - ios/App/App/Assets.xcassets/AppIcon.appiconset/**
      - scripts/generate-ios-artwork.py
  pull_request:
    paths:
      - ios/App/App.xcodeproj/project.pbxproj
      - .github/workflows/signing-settings.yml
      - .github/workflows/testflight.yml
      - scripts/ios-signing.mjs
      - tests/ios-signing.test.mjs
      - assets/branding/**
      - ios/App/App/Assets.xcassets/AppIcon.appiconset/**
      - scripts/generate-ios-artwork.py

permissions:
  contents: read

concurrency:
  group: ios-signing-settings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locate Apple distribution and certificate tools
        run: |
          xcrun --find altool
          openssl version
      - run: npm ci
      - run: npm run ios:sync
      - name: Verify the opaque 1024px icon source and installed asset
        run: |
          cmp assets/branding/BHU-AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -g format -g pixelWidth -g pixelHeight -g hasAlpha assets/branding/BHU-AppIcon-1024.png > "$RUNNER_TEMP/BHU-icon-properties.txt"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const properties = readFileSync(`${process.env.RUNNER_TEMP}/BHU-icon-properties.txt`, 'utf8');
          assert.match(properties, /format:\s+png\b/i);
          assert.match(properties, /pixelWidth:\s+1024\b/);
          assert.match(properties, /pixelHeight:\s+1024\b/);
          assert.match(properties, /hasAlpha:\s+no\b/i);
          console.log('PASS: opaque 1024x1024 PNG source matches the installed AppIcon.');
          JS
      - name: Compile the icon and asset catalog for iPhone and iPad
        run: |
          mkdir -p "$RUNNER_TEMP/BHU-assets"
          xcrun actool ios/App/App/Assets.xcassets \
            --compile "$RUNNER_TEMP/BHU-assets" --platform iphoneos \
            --minimum-deployment-target 15.0 --target-device iphone --target-device ipad \
            --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/BHU-assets-info.plist" \
            --output-format human-readable-text --warnings --notices --errors
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const directory = process.env.RUNNER_TEMP;
          assert.ok(existsSync(`${directory}/BHU-assets/Assets.car`));
          const info = JSON.parse(execFileSync('plutil', ['-convert', 'json', '-o', '-', `${directory}/BHU-assets-info.plist`], { encoding: 'utf8' }));
          assert.equal(info.CFBundleIcons?.CFBundlePrimaryIcon?.CFBundleIconName ?? info.CFBundleIconName, 'AppIcon');
          console.log('PASS: Xcode compiled the asset catalog and selected AppIcon for the application.');
          JS
      - name: Check distribution helper when present
        run: |
          if [ -f scripts/ios-signing.mjs ]; then
            node --check scripts/ios-signing.mjs
            node --test tests/ios-signing.test.mjs
          fi
      - name: Read effective Xcode settings without a signing account
        run: |
          for configuration in Debug Release; do
            xcodebuild -project ios/App/App.xcodeproj -scheme App \
              -configuration "$configuration" -sdk iphoneos \
              -showBuildSettings -json CODE_SIGNING_ALLOWED=NO \
              > "$RUNNER_TEMP/BHU-$configuration-settings.json"
          done
      - name: Verify the configured team in both App configurations
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const configuration of ['Debug', 'Release']) {
            const records = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/BHU-${configuration}-settings.json`, 'utf8'));
            const apps = records.filter(record => record.target === 'App');
            assert.equal(apps.length, 1, 'Expected one App target');
            const settings = apps[0].buildSettings;
            assert.equal(settings.CONFIGURATION, configuration);
            assert.equal(settings.DEVELOPMENT_TEAM, 'T4F4D367KQ');
            assert.equal(settings.CODE_SIGN_STYLE, 'Automatic');
            assert.equal(settings.CODE_SIGNING_ALLOWED, 'NO');
            assert.equal(settings.PRODUCT_BUNDLE_IDENTIFIER, 'com.fevzicakmak.bhu');
            console.log(`PASS ${configuration}: configured team T4F4D367KQ, Automatic signing, verification remains unsigned.`);
          }
          JS
