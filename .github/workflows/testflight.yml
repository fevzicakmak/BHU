name: iOS Signing and TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Validate and upload the signed IPA to App Store Connect for TestFlight processing
        type: boolean
        default: false
        required: true
      build_number:
        description: 'Optional CFBundleVersion (1–3 numeric components); blank uses run_number.run_attempt'
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: ios-manual-distribution
  cancel-in-progress: false

jobs:
  distribute:
    # Signing secrets are used only for an explicit manual dispatch of trusted main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      BHU_UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight && 'true' || 'false' }}
      BHU_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fail fast if required signing inputs are missing or malformed
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node scripts/ios-signing.mjs preflight
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run ios:sync
      - name: Check signing helper
        run: |
          node --check scripts/ios-signing.mjs
          node --test tests/ios-signing.test.mjs
      - name: Archive, verify and export a real signed App Store IPA
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node scripts/ios-signing.mjs distribute
      - name: Keep the verified signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: BHU-AppStore-IPA
          path: |
            ios-distribution/BHU.ipa
            ios-distribution/distribution-summary.json
          if-no-files-found: error
          retention-days: 7
